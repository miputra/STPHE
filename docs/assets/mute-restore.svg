<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-labelledby="title"><title id="title">Mute preserves your selection</title><rect width="720" height="404" rx="14" fill="#181f2b"/><g font-family="Segoe UI, sans-serif" fill="#dce0e7"><text x="28" y="30" font-size="11" fill="#adbed7">EXPLANATORY DIAGRAM · NOT AN APP SCREENSHOT</text><text x="28" y="66" font-size="24" font-weight="600">Mute preserves your selection</text><rect x="24" y="92" width="672" height="64" rx="7" fill="#273247"/><text x="40" y="117" font-size="17" font-weight="600">Before mute</text><text x="40" y="141" font-size="14">Prompt A: on   ·   Prompt B: on   ·   Prompt C: off</text><rect x="24" y="168" width="672" height="64" rx="7" fill="#273247"/><text x="40" y="193" font-size="17" font-weight="600">Folder muted</text><text x="40" y="217" font-size="14">All three inactive; the remembered selection stays on / on / off.</text><rect x="24" y="244" width="672" height="64" rx="7" fill="#273247"/><text x="40" y="269" font-size="17" font-weight="600">Folder restored</text><text x="40" y="293" font-size="14">A and B are active again. C stays off.</text><rect x="24" y="320" width="672" height="64" rx="7" fill="#273247"/><text x="40" y="345" font-size="17" font-weight="600">Enable all instead</text><text x="40" y="369" font-size="14">Changes the selection: A, B and C are all on.</text></g></svg>