<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-labelledby="title"><title id="title">From repository to documentation site</title><rect width="720" height="328" rx="14" fill="#181f2b"/><g font-family="Segoe UI, sans-serif" fill="#dce0e7"><text x="28" y="30" font-size="11" fill="#adbed7">EXPLANATORY DIAGRAM · NOT AN APP SCREENSHOT</text><text x="28" y="66" font-size="24" font-weight="600">From repository to documentation site</text><rect x="24" y="92" width="672" height="64" rx="7" fill="#273247"/><text x="40" y="117" font-size="17" font-weight="600">Repository</text><text x="40" y="141" font-size="14">docs/ contains pages, screenshots and the search index.</text><rect x="24" y="168" width="672" height="64" rx="7" fill="#273247"/><text x="40" y="193" font-size="17" font-weight="600">GitHub Actions</text><text x="40" y="217" font-size="14">.github/workflows/pages.yml uploads the docs/ directory.</text><rect x="24" y="244" width="672" height="64" rx="7" fill="#273247"/><text x="40" y="269" font-size="17" font-weight="600">GitHub Pages</text><text x="40" y="293" font-size="14">Open the URL reported by the successful deployment.</text></g></svg>